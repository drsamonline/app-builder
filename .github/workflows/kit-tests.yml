name: All kit tests

# One place to see every kit green. Runs each kit's headless test in parallel.
#
# FIXED: the matrix was hard-coded to 12 kits, but the account has 15 - so
# export-kit, frame-kit and profile-kit were NEVER tested. The matrix is now
# DISCOVERED from the account at run time, so a new kit is covered the day it is
# created and this list can never go stale again.

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      kits: ${{ steps.list.outputs.kits }}
    steps:
      - id: list
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          kits="$(gh api 'user/repos?per_page=100' --paginate                   --jq '[.[] | select(.name | endswith("-kit")) | .name] | sort | @json' 2>/dev/null || echo '[]')"
          echo "kits=$kits" >> "$GITHUB_OUTPUT"
          echo "Discovered kits: $kits"

  test:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kit: ${{ fromJSON(needs.discover.outputs.kits) }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: drsamonline/${{ matrix.kit }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run tests
        run: |
          if [ -f test-node.js ]; then node test-node.js
          else echo "::warning::${{ matrix.kit }} has no test-node.js"; fi
