name: All kit tests

# One place to see every kit green. Runs each kit's headless test in parallel.
#
# FIXED (2026-10-24): this workflow was FAILING on every run, and the dashboard showed
# it as "All kit tests - failure", which reads as "every kit's test is failing". It was
# not the kits. Discovery called `gh api user/repos`, and the built-in GITHUB_TOKEN is
# scoped to THIS repository - it cannot list the user's repos - so the call failed, the
# `|| echo '[]'` swallowed it, and `fromJSON('[]')` produced an EMPTY MATRIX. A matrix
# with no values fails the job, so a discovery bug looked like a test failure.
#
# Two fixes: read the PUBLIC repo list (`users/<owner>/repos`, which any token can read),
# and REFUSE to run an empty matrix with an error that says so.

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      kits: ${{ steps.list.outputs.kits }}
    steps:
      - id: list
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          kits="$(gh api 'users/drsamonline/repos?per_page=100' --paginate --slurp \
                    --jq '[.[][] | select(.name | endswith("-kit")) | .name] | sort | @json')"
          if [ -z "$kits" ] || [ "$kits" = "[]" ]; then
            echo "::error title=kit discovery found nothing::the discovery returned no kits. Refusing to run an empty matrix, which fails with a message that looks like a test failure."
            exit 1
          fi
          echo "kits=$kits" >> "$GITHUB_OUTPUT"
          echo "Discovered kits: $kits"

  test:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        kit: ${{ fromJSON(needs.discover.outputs.kits) }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: drsamonline/${{ matrix.kit }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run tests
        run: |
          if [ -f test-node.js ]; then node test-node.js
          else echo "::warning::${{ matrix.kit }} has no test-node.js"; fi
