name: All kit tests

# One place to see every kit green. Runs each kit's headless test in parallel.
#
# FIXED (2026-10-24): this workflow was FAILING on every run, and the dashboard showed
# it as "All kit tests - failure", which reads as "every kit's test is failing". It was
# not the kits. Discovery called `gh api user/repos`, and the built-in GITHUB_TOKEN is
# scoped to THIS repository - it cannot list the user's repos - so the call failed, the
# `|| echo '[]'` swallowed it, and `fromJSON('[]')` produced an EMPTY MATRIX. A matrix
# with no values fails the job, so a discovery bug looked like a test failure.
#
# Two fixes: read the PUBLIC repo list (`users/<owner>/repos`, which any token can read),
# and REFUSE to run an empty matrix with an error that says so.

on:
  schedule:
    - cron: "0 5 * * 3"   # weekly, Wednesday 05:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      kits: ${{ steps.list.outputs.kits }}
    steps:
      - id: list
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # `--slurp` CANNOT BE COMBINED WITH `--jq` - gh says so and exits 1. The 2026-10-24
          # fix introduced that pairing while fixing a different bug, so discovery has been
          # failing ever since and the dashboard read "All kit tests - failure" while no kit
          # test ran at all. Ask for the names, then let jq build the array.
          kits="$(gh api 'users/drsamonline/repos?per_page=100' --paginate \
                    --jq '.[] | select(.name | endswith("-kit")) | .name' 2>/dev/null \
                  | jq -R -s -c 'split("\n") | map(select(length>0)) | sort')"
          if [ -z "$kits" ] || [ "$kits" = "[]" ]; then
            echo "::error title=kit discovery found nothing::the discovery returned no kits. Refusing to run an empty matrix, which fails with a message that looks like a test failure."
            exit 1
          fi
          echo "kits=$kits" >> "$GITHUB_OUTPUT"
          echo "Discovered kits: $kits"

  test:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        kit: ${{ fromJSON(needs.discover.outputs.kits) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # was @v4
        with:
          fetch-depth: 1
          repository: drsamonline/${{ matrix.kit }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # was @v4
        with:
          node-version: "20"
      # A KIT WITH A DEPENDENCY COULD NEVER PASS. ui-kit's test needs jsdom, and this job ran
      # `node test-node.js` with nothing installed - so its failure was really a missing
      # `npm install`. The other 18 kits happen to need nothing, which is why it went unseen.
      - name: Install dependencies, if the kit declares any
        run: |
          if [ -f package.json ]; then
            npm install --no-audit --no-fund --silent || echo "::warning::${{ matrix.kit }}: npm install failed; the test may be missing a dependency"
          fi
      - name: Run tests
        run: |
          if [ -f test-node.js ]; then node test-node.js
          else echo "::warning::${{ matrix.kit }} has no test-node.js"; fi
