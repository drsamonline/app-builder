# The canonical app pipeline: BUILD + RELEASE + DEPLOY, in one call.
#
# SPDX-FileCopyrightText: 2026 Dr Sohil Momin
# SPDX-License-Identifier: PolyForm-Noncommercial-1.0.0
#
# ONE PUSH, ONE PIPELINE, THREE OUTPUTS - and they always come from the same
# commit, so the release and the live demo can never disagree:
#
#   push -> exe + apk + linux -> release (rolling `app-latest`) -> deploy the demo
#
# WHY THIS FILE EXISTS IN THE PUBLIC KIT
# A public repository can only call a reusable workflow that is ALSO public.
# Before this, 28 app repos carried a hand-copied 4.9 kB version of this file and
# that copy had drifted: it kept `if: always()` on the release job, which DELETED
# the published release before recreating it - so a failed build destroyed the
# release instead of merely not updating it. A copy cannot receive a fix. This is
# the single source of truth; app repos call it and inherit every future fix.
#
# THE CALLER MUST GRANT THE PERMISSIONS - a reusable workflow cannot raise its own
# above the caller's:
#
#   permissions:
#     contents: write    # to publish the release
#     pages: write       # to deploy the demo
#     id-token: write    # required by actions/deploy-pages
#
# HOW AN APP REPO CALLS IT (this is the whole file):
#
#   name: Build + deploy
#   on:
#     push: { branches: [ main ] }
#     pull_request: { branches: [ main ] }
#     workflow_dispatch:
#   permissions: { contents: write, pages: write, id-token: write }
#   concurrency: { group: build, cancel-in-progress: true }
#   jobs:
#     app:
#       uses: drsamonline/app-builder/.github/workflows/build.yml@main
#       with:
#         app_name: my-app
#         app_src: docs/play
#         deploy_path: docs
#       permissions: { contents: write, pages: write, id-token: write }

name: build

on:
  workflow_call:
    inputs:
      app_name:
        required: true
        type: string
      app_src:
        description: "Directory holding the app (index.html + assets)"
        required: true
        type: string
      deploy_path:
        description: "Directory to publish to Pages. Empty = do not deploy."
        required: false
        type: string
        default: ""
      release_tag:
        description: "Release tag to publish to. Multi-app repos must set a distinct tag per app."
        required: false
        type: string
        default: app-latest
      kit_repo:
        required: false
        type: string
        default: drsamonline/app-builder

# These MUST be granted here as well as by the caller. A reusable workflow cannot
# raise its own permissions above the caller's, but its top-level `permissions`
# block CAPS every job inside it - so declaring only `contents: write` here silently
# denied the pages job its OIDC token, and the deploy died with:
#   Error: Unable to get ACTIONS_ID_TOKEN_REQUEST_URL env variable
#   ##[error]Ensure GITHUB_TOKEN has permission "id-token: write".
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  # SUFFIXED, and it has to be. In a CALLED workflow the github context
  # reflects the CALLER, so `github.workflow` here is the caller's name. A
  # caller using the same shape then resolves to the same group, and GitHub
  # refuses to schedule the run - zero jobs, no log, no check run. That is
  # how forge/backup.yml failed 40 times. The literal suffix makes this
  # workflow's group its own.
  group: ${{ github.workflow }}-${{ github.ref }}-build
  cancel-in-progress: false

jobs:
  exe:
    name: Portable EXE (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { path: app-repo }
      - uses: actions/checkout@v4
        with: { repository: "${{ inputs.kit_repo }}", path: builder }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install --upgrade pip pyinstaller pefile
      - shell: bash
        run: |
          set -e
          rm -rf builder/exe/app && mkdir -p builder/exe/app
          cp -r "app-repo/${{ inputs.app_src }}/." builder/exe/app/
          APP_NAME="${{ inputs.app_name }}" python builder/exe/build.py
          # a glob loop, not `ls | head -1`: a filename with a newline breaks the
          # pipeline (SC2012), and a build directory is exactly where such a name appears
          exe=""
          for f in builder/exe/dist/*portable*.exe; do [ -e "$f" ] && exe="$f" && break; done
          if [ -z "$exe" ]; then echo "no portable exe was produced"; ls -la builder/exe/dist || true; exit 1; fi
          mkdir -p out && cp "$exe" "out/${{ inputs.app_name }}-portable.exe"
          ls -la out
      # The binary we ship, inspected before we ship it: a valid PE, an
      # executable, within budget, and no import we did not expect. See
      # tools/verify_exe.py. MAX_EXE_MB / REQUIRED_IMPORTS / FORBIDDEN_IMPORTS
      # are honoured if set.
      - name: Verify the EXE we ship
        shell: bash
        run: python builder/tools/verify_exe.py "out/${{ inputs.app_name }}-portable.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: portable-exe
          path: out/${{ inputs.app_name }}-portable.exe

  apk:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { path: app-repo }
      - uses: actions/checkout@v4
        with: { repository: "${{ inputs.kit_repo }}", path: builder }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - run: |
          SDKMANAGER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"
      - run: |
          rm -rf builder/apk/app/src/main/assets/www && mkdir -p builder/apk/app/src/main/assets/www
          cp -r "app-repo/${{ inputs.app_src }}/." builder/apk/app/src/main/assets/www/
          sed -i "s/APP_NAME_PLACEHOLDER/${{ inputs.app_name }}/g" builder/apk/app/src/main/res/values/strings.xml
          echo "sdk.dir=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" > builder/apk/local.properties
      - working-directory: builder/apk
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/builder/keystore/debug.keystore
          KEYSTORE_PASSWORD: android
          KEY_ALIAS: androiddebugkey
          KEY_PASSWORD: android
        run: gradle assembleRelease --no-daemon
      - run: |
          mkdir -p out
          cp builder/apk/app/build/outputs/apk/release/app-release.apk "out/${{ inputs.app_name }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: out/${{ inputs.app_name }}.apk

  linux:
    name: Portable binary (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The builder already produces a native binary on POSIX (build.py picks the
    # --add-data separator from os.name) - it was just never wired in, so Linux
    # users had nothing to download. Same source, same launcher, one more artefact.
    steps:
      - uses: actions/checkout@v4
        with: { path: app-repo }
      - uses: actions/checkout@v4
        with: { repository: "${{ inputs.kit_repo }}", path: builder }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install --upgrade pip pyinstaller
      - name: Build the Linux binary
        run: |
          set -e
          rm -rf builder/exe/app && mkdir -p builder/exe/app
          cp -r "app-repo/${{ inputs.app_src }}/." builder/exe/app/
          APP_NAME="${{ inputs.app_name }}" python builder/exe/build.py
          # a glob loop, not `ls | head -1` (SC2012)
          bin=""
          for f in builder/exe/dist/*portable*; do [ -e "$f" ] && bin="$f" && break; done
          if [ -z "$bin" ]; then echo "no linux binary was produced"; ls -la builder/exe/dist || true; exit 1; fi
          mkdir -p out && cp "$bin" "out/${{ inputs.app_name }}-linux"
          chmod +x "out/${{ inputs.app_name }}-linux"
          ls -la out
      # NOT just "it compiled". The binary serves the app over loopback and opens a
      # browser; if it cannot serve, it is not a deliverable. Start it, read the URL
      # it prints, fetch the page, stop it.
      - name: Smoke-test it - it must actually SERVE the app
        run: |
          set -uo pipefail
          PYTHONUNBUFFERED=1 ./out/${{ inputs.app_name }}-linux > /tmp/run.log 2>&1 &
          pid=$!
          url=""
          for _ in $(seq 1 25); do
            url="$(grep -oE 'http://127\.0\.0\.1:[0-9]+' /tmp/run.log | head -1 || true)"
            [ -n "$url" ] && break
            sleep 1
          done
          if [ -z "$url" ]; then
            echo "::error::the Linux binary never printed a URL in 25s"
            echo "--- what it printed (or did not) ---"; cat /tmp/run.log || true
            echo "--- is it running? ---"; ps -p $pid >/dev/null 2>&1 && echo "yes, pid $pid alive" || echo "no, it exited"
            kill $pid 2>/dev/null || true; exit 1
          fi
          code="$(curl -s -o /tmp/page.html -w '%{http_code}' "$url/" || echo 000)"
          kill $pid 2>/dev/null || true
          echo "served $url -> $code"
          if [ "$code" != "200" ]; then echo "::error::the binary did not serve the app"; cat /tmp/run.log; exit 1; fi
          grep -qi "<html" /tmp/page.html || { echo "::error::the served page is not HTML"; exit 1; }
          echo "the Linux binary serves the app." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-bin
          path: out/${{ inputs.app_name }}-linux

  version:
    name: Version and changelog
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # runs in parallel with the builds; it only touches VERSION, CHANGELOG.md and
    # changes/, and its commit carries [skip ci] so it cannot re-trigger itself.
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: "${{ inputs.kit_repo }}", path: .tools }
      - name: Consume the pending change files
        id: cl
        env:
          CHANGELOG_DIR: "."
        run: python3 .tools/tools/changelog.py
      - name: Commit the version and the changelog
        if: steps.cl.outputs.released == 'true'
        run: |
          git config user.name  "forge-bot"
          git config user.email "bot@users.noreply.github.com"
          git add VERSION CHANGELOG.md changes
          git commit -m "chore(release): v${{ steps.cl.outputs.version }} [skip ci]"
          # retry: a bare `git push` loses the race when anything else commits first
          BR="${GITHUB_REF_NAME:-main}"
          pushed=0
          for attempt in 1 2 3 4; do
            git fetch origin "$BR" --quiet
            git rebase "origin/$BR" --quiet || { git rebase --abort || true; sleep 4; continue; }
            if git push --quiet origin "HEAD:$BR"; then pushed=1; break; fi
            echo "::warning::push rejected on attempt $attempt - the branch moved again"
            sleep 4
          done
          [ "$pushed" = 1 ] || { echo "::error::could not push after 4 attempts - another workflow keeps moving the branch"; exit 1; }
      - name: Publish the versioned release
        if: steps.cl.outputs.released == 'true'
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          tag="v${{ steps.cl.outputs.version }}"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
                 --title "$tag" --notes-file .release-notes.md

  parity:
    name: A retrofit must not remove a capability
    # THE PARITY GATE, AS A CHECK.
    #
    # HANDOFF rule 1 says the direction is app -> kit, never kit -> app. A direction is
    # not a check: nothing compared what the app could DO before against what it could do
    # after, so "the kit is wired in" and "the app is weaker" looked identical. On
    # read-live-transform-app a retrofit wired export-kit in correctly and then deleted
    # the guarded fallback that had been performing every export, because the page had
    # never loaded the kit. It also added a green test asserting the fallback was gone,
    # so "tests pass" proved nothing.
    #
    # This refuses a REMOVAL and says what was removed:
    #   - an embedded JSON block that no longer parses (this killed that app for five
    #     hours: two unescaped quotes and the whole script never ran), or whose content
    #     changed (warning here, fatal when run by hand without --allow-data-change)
    #   - a call guarded by `if (window.Kit && ...)` that became bare
    #   - a kit that was available to the page and is now gone
    #   - a removed function name or element id
    # Additions never fail it. A retrofit that only adds is always allowed.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compare the app against its base
        run: |
          set -euo pipefail
          # one source of truth: fetch the tool from the kit, do not carry a copy
          curl -fsSL -o /tmp/parity.py \
            "https://raw.githubusercontent.com/${{ inputs.kit_repo }}/main/tools/retrofit-parity.py"
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          BASE="origin/${{ github.base_ref }}"
          fail=0
          seen=" "
          for f in "${{ inputs.app_src }}/index.html" "index.html"; do
            f="${f#./}"                       # app_src="." would otherwise test twice
            case "$seen" in *" $f "*) continue ;; esac
            seen="$seen$f "
            [ -f "$f" ] || continue
            if ! git cat-file -e "$BASE:$f" 2>/dev/null; then
              echo "parity: $f is new on this branch - nothing to compare"
              continue
            fi
            git show "$BASE:$f" > /tmp/before.html
            if cmp -s /tmp/before.html "$f"; then
              echo "parity: $f unchanged"
              continue
            fi
            echo "parity: $f"
            python3 /tmp/parity.py /tmp/before.html "$f" --allow-data-change || fail=1
          done
          if [ "$fail" = "1" ]; then
            echo "::error::this change removed a capability the app already had. Read the report above: a retrofit that removes something is a downgrade, not a retrofit."
            exit 1
          fi

  demo:
    name: The demo must be the app
    # THE WORKFLOW THAT CAUSES THE DRIFT, CORRECTED.
    #
    # docs/play/ is the public demo. Nothing ever compared it to the app, so a change that
    # reached the app and not the demo left TWO CODE PATHS for one program: a bug fixed in
    # one was never fixed in the other, and the code the public downloaded was not the code
    # that was maintained. skin-case-tracker and conqueror-os were both in that state.
    #
    # app-deliver now repairs a drifted demo daily. This PREVENTS one: the build fails, so
    # the change that caused it is the change that fixes it.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compare the demo to the app
        run: |
          set -euo pipefail
          APP="${{ inputs.app_src }}/index.html"
          DEPLOY="${{ inputs.deploy_path }}"
          DEMO="$DEPLOY/play/index.html"
          if [ ! -f "$APP" ]; then echo "no app at $APP"; exit 0; fi
          # WHERE THE DEMO LIVES IS deploy_path, NOT A CONSTANT.
          # This was hardcoded to docs/play/index.html, which is only true for repos that
          # put the app there. today-card uses app_src: docs with no docs/play/ at all, so
          # the check failed on every run with "the app has no public demo" while the app
          # was published perfectly well at docs/index.html. That is what made its pipeline
          # red on 2026-10-25 while every other job passed.
          if [ "$APP" = "$DEMO" ]; then
            echo "app_src IS $DEMO - one copy of the app, nothing to compare."
            echo "NOTE: this is the shape of every repo here that uses app_src: docs/play."
            echo "For those, this check has never compared anything; app-deliver's daily"
            echo "--sync-demos is what actually holds the demo and the app together."
            exit 0
          fi
          if [ ! -f "$DEMO" ]; then
            echo "$DEMO does not exist: this repo publishes $APP directly from $DEPLOY."
            echo "There is no second copy to drift, so there is nothing to compare - skipping."
            exit 0
          fi
          echo "two copies exist: comparing $APP against $DEMO"
          # the app may be copied into the demo with SEO tags added, so compare the CODE:
          # the kit methods each one calls. A demo missing a method the app uses is a demo
          # running older code.
          # The demo IS the app plus an SEO block: strip the block and compare the REST.
          # The first version compared kit calls and MISSED smartbill-app, whose demo was
          # missing GSTIN validation and input sanitisation - the app's OWN functions.
          python3 - "$APP" "$DEMO" <<'PY'
          import re, sys
          app = open(sys.argv[1], encoding="utf-8").read()
          demo = open(sys.argv[2], encoding="utf-8").read()
          stripped = re.sub(
              r'<meta name="description"[^>]*>\n?<link rel="canonical"[^>]*>\n?'
              r'(<meta property="og:[^>]*>\n?)*<meta name="twitter:card"[^>]*>\n?'
              r'<meta name="robots"[^>]*>\n?', "", demo, count=1)
          if stripped != app:
              print("::error::" + sys.argv[2] + " is not the app. Regenerate with: "
                    "python3 forge/tools/app-deliver.py --sync-demos")
              sys.exit(1)
          print("the demo is the app, plus its SEO block")
          PY

  release:
    name: Publish the rolling release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # EVERY build must succeed. No `if: always()` - a failed build must never
    # touch the published release.
    needs: [exe, apk, linux]
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/download-artifact@v4
        with: { name: portable-exe, path: dist }
      - uses: actions/download-artifact@v4
        with: { name: android-apk, path: dist }
      - uses: actions/download-artifact@v4
        with: { name: linux-bin, path: dist }
      - env:
          GH_TOKEN: "${{ github.token }}"
          APP_NAME: "${{ inputs.app_name }}"
          SHA: "${{ github.sha }}"
        run: |
          set -euo pipefail
          # NEVER delete the release first. Create it only if it is missing, then
          # upload with --clobber. A failure here leaves the previous release
          # intact, which the old delete-then-create could not promise.
          gh release view "${{ inputs.release_tag }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "${{ inputs.release_tag }}" --repo "$GITHUB_REPOSITORY" \
                 --title "Latest build: ${APP_NAME}" --notes "Rolling build of the newest commit on main."
          # UPLOAD WHAT EXISTS, not a fixed list of three. The old line named the exe, the
          # apk and the linux binary unconditionally, so a build that legitimately produced
          # only two of them FAILED THE WHOLE RELEASE - which is what has been happening to
          # neon-games/dead-zone. A missing artifact is worth a warning; it is not worth
          # withholding the release, because the release is also what carries the LICENCE.
          files=()
          for f in "dist/${APP_NAME}-portable.exe" "dist/${APP_NAME}.apk" "dist/${APP_NAME}-linux"; do
            if [ -f "$f" ]; then files+=("$f"); else echo "::warning::missing artifact $f"; fi
          done
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no artifacts at all to publish for ${APP_NAME}"; exit 1
          fi
          gh release upload "${{ inputs.release_tag }}" --repo "$GITHUB_REPOSITORY" --clobber "${files[@]}"
          gh release edit "${{ inputs.release_tag }}" --repo "$GITHUB_REPOSITORY" \
            --notes "Automated build from ${SHA}. Assets: ${APP_NAME}-portable.exe (Windows), ${APP_NAME}.apk (Android), ${APP_NAME}-linux (Linux)."
          echo "### Released ${APP_NAME} from ${SHA}" >> "$GITHUB_STEP_SUMMARY"

  pages:
    name: Deploy the demo
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # deploy only from main, and only after the release landed - so the live demo
    # and the released build are always the same commit
    needs: [release]
    if: github.event_name != 'pull_request' && inputs.deploy_path != ''
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Fail early if there is nothing to publish
        run: |
          if [ ! -d "${{ inputs.deploy_path }}" ]; then
            echo "::error::deploy_path '${{ inputs.deploy_path }}' does not exist"
            exit 1
          fi
      - name: Enable Pages if it is not on yet
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          set -uo pipefail
          # A BRAND-NEW REPO HAS NO PAGES SITE. `configure-pages` then dies with
          #   ##[error]Get Pages site failed ... Error: Not Found
          # and the whole pipeline goes red on a repo that is perfectly fine - the
          # deploy was simply never switched on. The pipeline should be able to
          # finish on a repo it has just been given, so turn it on here.
          # Already-on is not a failure, so it is reported and ignored.
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            echo "Pages is already enabled"
          elif gh api -X POST "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow >/dev/null 2>&1; then
            echo "Pages enabled (source: GitHub Actions)"
          else
            echo "::warning title=Pages not enabled::could not enable Pages from here. Set Settings > Pages > Source = GitHub Actions, and this deploy will go through."
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: "${{ inputs.deploy_path }}" }
      - id: deployment
        uses: actions/deploy-pages@v4

  shot:
    name: Screenshot the live demo
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # AFTER the deploy, so the picture cannot show an older build than the one you
    # can download. It never fails the pipeline for a missing screenshot - a broken
    # picture must not block a release.
    needs: [pages]
    if: github.event_name != 'pull_request' && inputs.deploy_path != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: "${{ inputs.kit_repo }}", path: builder }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm i --no-save puppeteer
      - name: Capture it, and put it in the README
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          set -uo pipefail
          sleep 25   # let Pages publish the deploy we just made
          node builder/tools/shot.js \
            --url "https://${{ github.repository_owner }}.github.io/${{ inputs.app_name }}/play/" \
            --out docs/shot.png --readme README.md
          git config user.name  "forge-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A docs/shot.png README.md
          if git diff --cached --quiet; then
            echo "the screenshot is unchanged"
          else
            git commit -m "chore: screenshot of the live demo [skip ci]"
            # retry: a bare `git push` loses the race when anything else commits first
            BR="${GITHUB_REF_NAME:-main}"
            pushed=0
            for attempt in 1 2 3 4; do
              git fetch origin "$BR" --quiet
              git rebase "origin/$BR" --quiet || { git rebase --abort || true; sleep 4; continue; }
              if git push --quiet origin "HEAD:$BR"; then pushed=1; break; fi
              echo "::warning::push rejected on attempt $attempt - the branch moved again"
              sleep 4
            done
            [ "$pushed" = 1 ] || { echo "::error::could not push after 4 attempts - another workflow keeps moving the branch"; exit 1; }
          fi
