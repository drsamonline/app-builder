# Reusable build: portable Windows EXE + signed Android APK, then a fixed-tag release.
#
# Lives in the PUBLIC app-builder kit so that public app repos can call it
# (a public caller can only use public reusable workflows).
#
# A consuming app repo calls it in a few lines:
#
#   jobs:
#     build:
#       uses: drsamonline/app-builder/.github/workflows/build.yml@main
#       with:
#         app_name: my-app
#         app_src: docs

name: build

on:
  workflow_call:
    inputs:
      app_name:
        required: true
        type: string
      app_src:
        required: true
        type: string
      kit_repo:
        required: false
        type: string
        default: drsamonline/app-builder

permissions:
  contents: write

jobs:
  exe:
    name: Portable EXE (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: app-repo }
      - uses: actions/checkout@v4
        with: { repository: "${{ inputs.kit_repo }}", path: builder }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install --upgrade pip pyinstaller
      - shell: bash
        run: |
          rm -rf builder/exe/app && mkdir -p builder/exe/app
          cp -r "app-repo/${{ inputs.app_src }}/." builder/exe/app/
          python builder/exe/build.py
          mkdir -p out && cp "builder/exe/dist/${{ inputs.app_name }}-portable.exe" "out/"
      - uses: actions/upload-artifact@v4
        with:
          name: portable-exe
          path: out/${{ inputs.app_name }}-portable.exe

  apk:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: app-repo }
      - uses: actions/checkout@v4
        with: { repository: "${{ inputs.kit_repo }}", path: builder }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - run: |
          SDKMANAGER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"
      - run: |
          rm -rf builder/apk/app/src/main/assets/www && mkdir -p builder/apk/app/src/main/assets/www
          cp -r "app-repo/${{ inputs.app_src }}/." builder/apk/app/src/main/assets/www/
          sed -i "s/APP_NAME_PLACEHOLDER/${{ inputs.app_name }}/g" builder/apk/app/src/main/res/values/strings.xml
          echo "sdk.dir=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" > builder/apk/local.properties
      - working-directory: builder/apk
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/builder/keystore/debug.keystore
          KEYSTORE_PASSWORD: android
          KEY_ALIAS: androiddebugkey
          KEY_PASSWORD: android
        run: gradle assembleRelease --no-daemon
      - run: |
          mkdir -p out
          cp builder/apk/app/build/outputs/apk/release/app-release.apk "out/${{ inputs.app_name }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: out/${{ inputs.app_name }}.apk

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [exe, apk]
    if: always()
    steps:
      - uses: actions/download-artifact@v4
        with: { name: portable-exe, path: dist }
      - uses: actions/download-artifact@v4
        with: { name: android-apk, path: dist }
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release delete app-latest --repo "${{ github.repository }}" --yes --cleanup-tag || true
          gh release create app-latest --repo "${{ github.repository }}" \
            --title "Latest build" --notes "Automated build from ${{ github.sha }}." \
            "dist/${{ inputs.app_name }}-portable.exe" "dist/${{ inputs.app_name }}.apk"
