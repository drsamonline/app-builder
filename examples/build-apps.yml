name: Build + deploy

# Drop this file into a consuming app repo as .github/workflows/build-apps.yml
# and set the three values under `with:` to match your layout. The build itself
# lives in the reusable workflow in drsamonline/app-builder, so a fix there
# reaches every app at once.
#
# DO NOT COPY THE WORKFLOW BODY. An earlier hand-copied version of this file
# drifted and kept `if: always()` on the release job, which DELETED the published
# release before recreating it — so a failed build destroyed the release instead
# of merely not updating it. Call it; do not copy it.
#
#   app_name    -> asset names: <app_name>-portable.exe and <app_name>.apk
#   app_src     -> folder holding the app (index.html + any assets)
#   deploy_path -> folder to publish to Pages ("" = do not deploy)

on:
  push:
    branches: [ main ]
    # A change touching only root docs/meta cannot change the build or the demo,
    # so skip the whole pipeline for it. Anything under app_src or deploy_path
    # (or this workflow itself) still runs it.
    paths-ignore:
      - "/*.md"
      - "/LICENSE"
      - "/LICENSE-*"
      - "/.gitignore"
      - "/AUTHORS"
      - "/NOTICE"
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# The CALLER grants the permissions — a reusable workflow cannot raise its own
# above the caller's.
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  app:
    uses: drsamonline/app-builder/.github/workflows/build.yml@main
    with:
      app_name: my-app
      app_src: docs/play
      deploy_path: docs
    permissions:
      contents: write
      pages: write
      id-token: write
